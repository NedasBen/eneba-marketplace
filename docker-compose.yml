services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eneba
      POSTGRES_USER: eneba
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
volumes:
  pgdata: